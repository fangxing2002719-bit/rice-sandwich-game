<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Rice Sandwich Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="game-container">

    <h1>🥪 A Rice Sandwich</h1>
    <h2>Esperanza's Journey</h2>

    <p>Help Esperanza reach the school canteen!</p>

    <div id="board">

      <div class="space">
        🏠<br>
        Start
        <span id="player">🔵</span>
      </div>

      <div class="space">
        ❓<br>
        Question
      </div>

      <div class="space">
        🥪<br>
        Rice Sandwich
      </div>

      <div class="space">
        ✉️<br>
        Mother's Letter
      </div>

      <div class="space">
        🏫<br>
        School
      </div>

      <div class="space">
        👩‍🦳<br>
        The Nun
      </div>

      <div class="space">
        📚<br>
        Sister Superior
      </div>

      <div class="space">
        🏢<br>
        The House
      </div>

      <div class="space">
        😢<br>
        Crying
      </div>

      <div class="space">
        🍽️<br>
        Canteen
      </div>

    </div>

    <button id="rollButton">🎲 Roll Dice</button>

    <p id="diceResult">Dice: -</p>

  </div>
<script src="script.js"></script>
</body>

</html>
